# Copy this file to .github/workflows/release-apk.yml to build a debug APK on tags named v*.
# It is kept here because the release archive does not include .github/workflows.
name: Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: clean-launch-debug
          path: app/build/outputs/apk/debug/*.apk
